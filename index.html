<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>つぶぐみ総選挙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      background: #d2b48c;
      padding: 60px 16px;
    }

    h1 {
      margin-bottom: 32px;
    }

    #topic {
      font-size: 22px;
      background: #66cdaa;
      padding: 24px;
      margin: 24px auto;
      max-width: 520px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    button {
      font-size: 18px;
      padding: 14px 36px;
      border: none;
      border-radius: 999px;
      background: #ff6b6b;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<h1>🎲 つぶぐみ総選挙 🎲</h1>

<div id="topic">ボタンを押してね！</div>

<button onclick="drawTopic()">ガチャを回す</button>

<script>
const topics = [
  "この中でいちばん絵がうまいと思う人は？",
  
  "この中でいちばん"
];

function drawTopic() {
  const randomIndex = Math.floor(Math.random() * topics.length);
  document.getElementById("topic").textContent = topics[randomIndex];
}
</script>

</body>
</html>
