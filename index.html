<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>つぶぐみ総選挙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      background: #a8bf93;
      padding: 60px 16px;
    }

    h1 {
      margin-bottom: 32px;
    }

    #topic {
      font-size: 22px;
      background: #d6e9ca;
      padding: 24px;
      margin: 24px auto;
      max-width: 520px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    button {
      font-size: 18px;
      padding: 14px 36px;
      border: none;
      border-radius: 999px;
      background: #165e83;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<h1>🎲 つぶぐみ総選挙 🎲</h1>

<div id="topic">ボタンを押してね！</div>

<button onclick="drawTopic()">ガチャを回す</button>

<script>
const topics = [
  "この中でいちばん絵がうまいと思う人は？",
  "この中でいちばん異性からモテそうな人は？",
  "この中でいちばん歌がうまいと思う人は？",
  "この中でいちばん天然だと思う人は？",
  "この中でいちばんハチワレに似てると思う人は？",
  "この中でいちばん早口言葉がうまそうな人は？",
  "この中でいちばん足が速そうな人は？",
  "この中でいちばん足が速そうな人は？（小中学生時代）",
  "この中でいちばんお風呂の時間が長そうな人は？",
  "この中でいちばんおもしろいと思う人は？",
  "この中でいちばんMPが高そうな人は？",
  "この中でいちばん絵パイロットっぽい人は？",
  "この中でいちばん長生きしそうな人は？",
  "この中でいちばん涙もろそうな人は？",
  "この中でいちばん泣かなそうな人は？",
  "この中でいちばん子どもに好かれそうな人は？",
  "この中でいちばん動物に好かれそうな人は？",
  "この中でいちばん先輩に好かれそうな人は？",
  "この中でいちばん後輩に好かれそうな人は？",
  "この中でいちばんお年寄りに好かれそうな人は？",
  "この中でいちばんサプライズが得意そうな人は？",
  "この中でいちばん早く結婚しそうな人は？",
  "この中でいちばん集合写真の時最前で寝転がってそうな人は？",
  "この中でいちばん風邪をひかなそうな人は？",
  "この中でいちばん第一印象から乖離がある人は？",
  "この中でいちばんナンパが得意そうな人は？",
  "この中でいちばん嘘をつくのがうまい人は？",
  "この中でいちばん実技科目が得意そうな人は？",
  "この中でいちばん跳び箱高く跳べそうな人は？",
  "この中でいちばんゲームがうまい人は？",
  "この中でいちばん重い罪を犯しそうな人は？",
  "この中でいちばんテストの最低点数が高そう人は？",
  "この中でいちばん信頼できる人は？",
  "この中でいちばん怒ったら怖そうな人は？",
  "この中でいちばんカメラロールの写真多そうな人は？",
  "この中でいちばん"
];

function drawTopic() {
  const randomIndex = Math.floor(Math.random() * topics.length);
  document.getElementById("topic").textContent = topics[randomIndex];
}
</script>

</body>
</html>
